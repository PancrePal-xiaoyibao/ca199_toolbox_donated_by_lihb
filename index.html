<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>医疗指标趋势管理一页通</title>
  <script src="js/papaparse.min.js"></script>
  <script src="js/echarts.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f9fafb;
      padding: 1.5rem;
      margin: 0;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #7c3aed;
      margin: 0;
      letter-spacing: -0.025em;
    }
    .header-container {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    .logo {
      width: 3.5rem;
      height: auto;
      filter: drop-shadow(0 4px 6px rgba(124, 58, 237, 0.1));
    }
    .subtitle {
      font-size: 0.9375rem;
      color: #4b5563;
      margin-bottom: 1rem;
      line-height: 1.8;
    }
    .subtitle p {
      margin: 0.25rem 0;
    }
    .right-logo {
        display: none;
        margin-left: auto;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
    }
    .hidden { display: none; }
    .btn-file {
      padding: 0.375rem 0.75rem;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.875rem;
      margin-right: 0.5rem;
    }
    .btn-file:hover { background: #4338ca; }
    .file-info {
      font-size: 0.875rem;
      color: #4b5563;
      margin-top: 1.25rem;
    }
    .render-btn {
      margin-top: 0.75rem;
      width: 100%;
      background-color: #2563eb;
      color: white;
      padding: 0.375rem 0;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      border: none;
      cursor: pointer;
    }
    .render-btn:hover { background-color: #1d4ed8; }
    .content-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    @media (min-width: 1024px) {
      .content-container { flex-direction: row; }
    }
    .chart-container, .timeline-container {
      height: 550px;
      width: 100%;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
    }
    .timeline-container { height: 150px; margin-top: 1rem; }
    .selector-panel, .control-panel {
      width: 14rem;
      background: white;
      padding: 0.5rem;
      border: 1px solid #e5e7eb;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      box-sizing: border-box;
    }
    @media (min-width: 1024px) {
      .selector-panel, .control-panel { width: 12rem; flex-shrink: 0; }
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      padding: 0.25rem 0.5rem;
      border: 1px solid #e5e7eb;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .checkbox-item:hover { background-color: #f9fafb; }
    .checkbox-item input { margin-right: 0.5rem; }
    .legend-container {
      margin-top: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .legend-item { display: flex; align-items: center; font-size: 0.75rem; }
    .legend-color { width: 12px; height: 12px; border-radius: 2px; margin-right: 0.3rem; }

    .control-panel label {
      font-size: 0.875rem;
    }
    .control-panel input[type="checkbox"] {
      transform: scale(1.2);
    }
    .control-panel input[type="number"],
    .control-panel input[type="range"] {
      margin-top: 0.25rem;
    }

    .rich-text {
      font-size: 12px !important;
      font-weight: bold;
      color: #FF6B6B;
    }
    .w-full { width: 100%; box-sizing: border-box; }
    .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
    .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
    .border { border: 1px solid #e5e7eb; }
    .rounded { border-radius: 0.25rem; }
    .text-sm { font-size: 0.875rem; }
    .mb-2 { margin-bottom: 0.5rem; }

    /* 新增：显示控制区域布局样式 */
    .control-section {
      margin-bottom: 0.5rem;
    }
    .control-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: block;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      flex-wrap: nowrap;
    }
    .checkbox-row label {
      white-space: nowrap;
      font-size: 0.875rem;
    }
    .checkbox-row input[type="checkbox"] {
      transform: scale(1.2);
      margin: 0;
    }
    .threshold-container {
      margin-left: 0.25rem;
      margin-bottom: 0.5rem;
    }
    .threshold-container label {
      display: block;
      font-size: 0.75rem;
      color: #4b5563;
      margin-bottom: 0.25rem;
    }

    /* 确保搜索框宽度适配 */
    #indicatorSearchInput {
      box-sizing: border-box;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="header-container">
    <img src="https://picgo-1302991947.cos.ap-guangzhou.myqcloud.com/images/Pop%20Mart%20Character%20Front%20View%20(2).png" alt="Logo" class="logo">
    <h1>医疗指标趋势管理一页通</h1>
  </div>
  <div class="subtitle">
    <p>➡️ 感谢志愿者@lihb的代码贡献与无私开源，携手小胰宝社区，助力肿瘤患者及家庭实现主动科学的病情管理。</p>
    <p>➡️ 小胰宝社区是重庆天工开物基金会旗下公益项目，通过AI技术赋能胰腺肿瘤患友，请关注微信公众号“小胰宝助手”。</p>
  </div>
  <!-- 修改外层容器，使用 flex 布局并设置 justify-content: space-between -->
<div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
  <!-- 左侧按钮组 -->
  <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
    <div>
      <label class="btn-file" title="请选择同目录下的 data.csv">
        加载指标数据 (data.csv)
        <input type="file" id="dataFile" accept=".csv" style="display:none" />
      </label>
      <div id="dataFileName" class="file-info"></div>
    </div>

    <div>
      <label class="btn-file" title="请选择同目录下的 medication.csv">
        加载用药数据 (medication.csv)
        <input type="file" id="medFile" accept=".csv" style="display:none" />
      </label>
      <div id="medFileName" class="file-info"></div>
    </div>
    <div>
      <label class="btn-file" title="请选择同目录下的 remarksline.csv">
        加载标注数据 (remarksline.csv)
        <input type="file" id="remarkFile" accept=".csv" style="display:none" />
      </label>
      <div id="remarkFileName" class="file-info"></div>
    </div>
  </div>

  <!-- 右侧logo图片 -->
  <div class="right-logo">
    <img src="https://picgo-1302991947.cos.ap-guangzhou.myqcloud.com/images/Pop%20Mart%20Character%20Front%20View%20(2).png" alt="小胰宝社区" class="logo" style="height: 60px; width: auto;" />
    <span style="font-size: 14px; color: #333; font-weight: 500;">请关注微信公众号“小胰宝助手”</span>
  </div>
</div>

  <div id="content" class="hidden">
    <div class="content-container">
      <div style="flex:1; min-width:0;">
        <div id="chartContainer" class="chart-container"></div>
        <div id="timelineContainer" class="timeline-container"></div>
        <div id="legendContainer" class="legend-container"></div>
      </div>

      <div class="selector-panel">
        <div class="control-section">
          <span class="control-title">时间筛选</span>
          <!-- 核心：压缩间距+限制总宽度，避免超出容器 -->
          <div style="display: flex; gap: 0.25rem; margin-bottom: 0.5rem; width: calc(100% - 8px);">
            <input
              type="number"
              id="startYear"
              placeholder="起始年"
              min="2020"
              max="2099"
              value="2022"
              style="flex: 1; padding: 0.25rem 0.2rem; border: 1px solid #d1d5db; border-radius: 0.375rem; font-size: 0.8rem; box-sizing: border-box; margin: 0;"
            >
            <input
              type="number"
              id="endYear"
              placeholder="截止年"
              min="2020"
              max="2099"
              value="2030"
              style="flex: 1; padding: 0.25rem 0.2rem; border: 1px solid #d1d5db; border-radius: 0.375rem; font-size: 0.8rem; box-sizing: border-box; margin: 0;"
            >
          </div>
        </div>
        <!-- 重构后的显示控制区域 -->
        <div class="control-section">
          <span class="control-title">显示控制</span>
          <div class="checkbox-row">
            <label>关键点</label>
            <input type="checkbox" id="showKeyPoints" checked />
            <label>变化率</label>
            <input type="checkbox" id="showChangeRate" />
          </div>

          <div id="changeThresholdContainer" class="threshold-container" style="display: none;">
            <label>数值变化 ≥</label>
            <input type="number" id="changeThreshold" value="0" min="0" step="0.1"
              style="width: calc(100% - 10px); /* 减少宽度，预留边距 */
                   padding: 0.375rem 0.25rem; /* 减少左右内边距 */
                   border: 1px solid #d1d5db;
                   border-radius: 0.375rem;
                   font-size: 0.875rem;
                   box-sizing: border-box; /* 关键：padding 计入宽度 */" />
          </div>

          <div id="percentThresholdContainer" class="threshold-container" style="display: none;">
            <label>变化幅度 ≥ <span id="percentValue">20%</span></label>
            <input type="range" id="percentThreshold" min="0" max="100" value="20" style="width: 100%;" />
          </div>
        </div>

        <!-- 选择指标区域 -->
        <!-- 父容器加样式，让子元素同行显示 -->
        <div style="display: flex; align-items: center; gap: 1rem;">
          <span class="control-title">选择指标</span>
          <span class="control-title" onclick="clearAllCheckboxes()" >点击取消</span>
        </div>

        <div class="mb-2">
          <input             type="text"             placeholder="搜索指标..."             class="w-full px-2 py-1 border rounded text-sm"            id="indicatorSearchInput"             oninput="filterIndicators()"           >
        </div>
        <div id="checkboxContainer"></div>
        <button onclick="renderCharts()" class="render-btn">生成图表</button>
      </div>
    </div>
  </div>

<script>
let allIndicators = [];
let medications = [];
let uniqueNames = [];
let remarks = []; // 修正：变量名从 remarksNames 改为 remarks

const DEFAULT_CONFIG = {
  dataTable: {
    timeField: 'testTime',
    nameField: 'indicatorName',
    valueField: 'indicatorValue'
  },
  medicationTable: {
    startTimeField: 'START_DATE',
    endTimeField: 'END_DATE',
    regimenField: 'DRUG_NAME',
    tagField: 'TAG'
  }
};

function isNumeric(val) {
  if (val === null || val === undefined || val === '') return false;
  const str = String(val).trim().toLowerCase();
  const invalid = ['true','false','yes','no','阳性','阴性','normal','abnormal','n/a','na','-','--','none','null','undefined'];
  if (invalid.includes(str)) return false;
  return !isNaN(val) && !isNaN(parseFloat(val));
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsText(file);
  });
}

document.getElementById('dataFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  // 隐藏头部
  document.querySelector('.header-container').style.display = 'none';
  document.querySelector('.subtitle').style.display = 'none';
  document.querySelector('.right-logo').style.display = 'flex';

  document.getElementById('dataFileName').textContent = `已加载: ${file.name}`;
  const text = await readFile(file);
  const data = Papa.parse(text, { header: true, skipEmptyLines: true }).data;
  processMainData(data);
  tryRenderContent();
  document.getElementById('dataFileName').textContent = `已加载: ${file.name}，共 ${data.length} 条数据`;
  e.target.value = '';
});

document.getElementById('medFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('medFileName').textContent = `已加载: ${file.name}`;
  const text = await readFile(file);
  const meds = Papa.parse(text, { header: true, skipEmptyLines: true }).data;
  processMedications(meds);
  tryRenderContent();
  document.getElementById('medFileName').textContent = `已加载: ${file.name}，共 ${meds.length} 条数据`;
  e.target.value = '';
});

document.getElementById('remarkFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('remarkFileName').textContent = `已加载: ${file.name}`;
  const text = await readFile(file);
  const remark = Papa.parse(text, { header: true, skipEmptyLines: true }).data;
  processRemarks(remark); // 传入解析后的行数据，而非文本
  tryRenderContent();
  // 修复1：移除有效行数显示
  document.getElementById('remarkFileName').textContent = `已加载: ${file.name}，共 ${remark.length} 条数据`;
  e.target.value = '';
});

function processMainData(rows) {
  allIndicators = [];
  const { timeField, nameField, valueField } = DEFAULT_CONFIG.dataTable;

  for (const row of rows) {
    const rawTime = row[timeField]?.trim();
    const name = row[nameField]?.trim();
    const val = row[valueField];

    if (!rawTime || !name) continue;

    const dt = new Date(rawTime);
    if (isNaN(dt)) continue;
    const testTime = dt.toISOString().split('T')[0];

    if (isNumeric(val)) {
      allIndicators.push({
        indicatorName: name,
        indicatorValue: parseFloat(val),
        indicatorValueRaw: val,
        testTime: testTime
      });
    }
  }

  uniqueNames = [...new Set(allIndicators.map(i => i.indicatorName))].sort();
}

function processMedications(rows) {
  medications = [];
  const { startTimeField, endTimeField, regimenField,tagField } = DEFAULT_CONFIG.medicationTable;

  for (const row of rows) {
    const start = row[startTimeField]?.trim();
    const end = row[endTimeField]?.trim();
    const regimen = row[regimenField]?.trim();
    const tag = row[tagField]?.trim();
    if (!start || !end || !regimen) continue;

    const startDt = new Date(start);
    const endDt = new Date(end);
    if (isNaN(startDt) || isNaN(endDt) || startDt > endDt) continue;

    medications.push({
      startTime: startDt.toISOString().split('T')[0],
      endTime: endDt.toISOString().split('T')[0],
      regimen: regimen,
      tag: tag,
      startTimeStamp: startDt.getTime(),
      endTimeStamp: endDt.getTime()
    });
  }
}

// 修正：processRemarks 接收解析后的行数据，而非文本
function processRemarks(rows) {
  remarks = []; // 清空原有标注数据

  for (const row of rows) {
    // 清理数据中的多余单引号
    const date_str = (row['REMARKS_DATE'] || '').trim().replace(/'/g, '');
    const remark_str = (row['REMARKS'] || '').trim().replace(/'/g, '');
    const offsetx = parseFloat(row['OFFSETX']) || 0;
    const offsety = parseFloat(row['OFFSETY']) || 0;

    if (!date_str || !remark_str) continue;

    const dt = new Date(date_str);
    if (isNaN(dt.getTime())) continue; // 严格判断日期有效性

    const formatted_date = dt.toISOString().split('T')[0];
    remarks.push({
      date: formatted_date,
      text: `${formatted_date}\n\n${remark_str}`,
      offsetx: offsetx,
      offsety: offsety,
      timestamp: dt.getTime() // 方便后续按时间排序
    });
  }

  remarks.sort((a, b) => a.timestamp - b.timestamp);
}

function tryRenderContent() {
  if (allIndicators.length > 0) {
    renderSelector();
    document.getElementById('content').classList.remove('hidden');
    setTimeout(() => renderCharts(), 10);
  }
}

function renderSelector() {
  const container = document.getElementById('checkboxContainer');
  container.innerHTML = '';
  uniqueNames.forEach(name => {
    const label = document.createElement('label');
    label.className = 'checkbox-item';
    label.setAttribute('data-indicator-name', name);
    label.innerHTML = `<input type="checkbox" value="${name}"> ${name}`;
    container.appendChild(label);
  });

  const firstCheckbox = container.querySelector('input[type="checkbox"]');
  if (firstCheckbox) firstCheckbox.checked = true;
}

function getMedicationsAtTime(timeStamp) {
  if (medications.length === 0) return ['无用药记录'];
  const matchedMeds = medications.filter(med => timeStamp >= med.startTimeStamp && timeStamp <= med.endTimeStamp);
  if (matchedMeds.length === 0) return ['无用药记录'];
  return matchedMeds.map(med => `${med.regimen} (${med.startTime} 至 ${med.endTime})`);
}

// ========== 图表渲染 ==========
function renderCharts() {
  const selected = Array.from(document.querySelectorAll('#checkboxContainer input:checked')).map(cb => cb.value);
  if (selected.length === 0) {
    alert('请至少选择一个指标');
    return;
  }

  const chartDom = document.getElementById('chartContainer');
  const timelineDom = document.getElementById('timelineContainer');
  const chart = echarts.getInstanceByDom(chartDom) || echarts.init(chartDom);
  const timeline = echarts.getInstanceByDom(timelineDom) || echarts.init(timelineDom);

  // ========== 新增：获取年份筛选条件 ==========
  const startYear = parseInt(document.getElementById('startYear').value) || 2020;
  const endYear = parseInt(document.getElementById('endYear').value) || new Date().getFullYear();

  // 验证年份合法性
  if (startYear > endYear) {
    alert('起始年不能大于截止年！');
    return;
  }
  if (startYear < 2020 || endYear > 2099) {
    alert('年份范围需在2020-2099之间！');
    return;
  }

  // 转换为时间戳（起始年1月1日 00:00:00，截止年12月31日 23:59:59）
  const startYearTime = new Date(startYear, 0, 1).getTime();
  const endYearTime = new Date(endYear, 11, 31, 23, 59, 59).getTime();

  // ========== 新增：根据年份筛选指标数据 ==========
  const indicatorData = allIndicators.filter(i => {
    // 仅保留选中的指标 + 年份范围内的数据
    const dataTime = new Date(i.testTime).getTime();
    return selected.includes(i.indicatorName) && dataTime >= startYearTime && dataTime <= endYearTime;
  });

  // 如果筛选后无数据，提示用户
  if (indicatorData.length === 0) {
    alert(`在 ${startYear}-${endYear} 年份范围内无数据，请调整年份！`);
    return;
  }

  // ========== 调整：计算筛选后的时间范围 ==========
  const allTimePoints = [
    // 仅包含年份范围内的指标时间 + 用药时间 + 标注时间
    ...indicatorData.map(d => new Date(d.testTime).getTime()),
    ...medications.filter(m => {
      // 筛选年份范围内的用药数据
      const medStart = m.startTimeStamp;
      const medEnd = m.endTimeStamp;
      // 只要用药时间段和筛选年份有交集，就保留
      return !(medEnd < startYearTime || medStart > endYearTime);
    }).flatMap(m => [m.startTimeStamp, m.endTimeStamp]),
    ...remarks.map(r => r.timestamp) // 新增：标注时间点
  ];

  let globalMin, globalMax;
  if (allTimePoints.length > 0) {
    globalMin = Math.min(...allTimePoints);
    globalMax = Math.max(...allTimePoints);
    const range = globalMax - globalMin;
    const padding = range * 0.05 || 24 * 60 * 60 * 1000;
    globalMin -= padding;
    globalMax += padding;

    // 确保时间范围不超出年份筛选边界
    globalMin = Math.max(globalMin, startYearTime);
    globalMax = Math.min(globalMax, endYearTime);
  } else {
    // 无数据时，默认使用筛选的年份范围
    globalMin = startYearTime;
    globalMax = endYearTime;
  }

  const seriesMap = new Map();
  selected.forEach(name => seriesMap.set(name, []));
  indicatorData.forEach(d => {
    if (seriesMap.has(d.indicatorName)) {
      seriesMap.get(d.indicatorName).push([
        new Date(d.testTime).getTime(),
        d.indicatorValue,
        d.indicatorValueRaw
      ]);
    }
  });

  const colors = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#7f7f7f'];

  const showKeyPoints = document.getElementById('showKeyPoints').checked;
  const showChangeRate = document.getElementById('showChangeRate').checked;
  const changeThreshold = parseFloat(document.getElementById('changeThreshold').value) || 0;
  const percentThreshold = parseFloat(document.getElementById('percentThreshold').value) || 0;
  document.getElementById('percentValue').textContent = `${Math.round(percentThreshold)}%`;

  // 核心修复：提前构建标注线数据（对齐Python逻辑，使用date字符串）
  // 核心修复：标注线文字方向与居中位置
const markLineData = remarks
  .filter(r => r.timestamp >= startYearTime && r.timestamp <= endYearTime)
  .map(r => ({
    xAxis: r.date,
    label: {
      show: true,
      formatter: r.text,
      fontWeight: 'bold',
      fontSize: 11,
      padding: [6, 8],
      // 关键修复：
      position: 'middle',      // 文字在线的中间位置
      rotate: 0,               // 强制文字水平显示，不旋转
      offset: [
        r.offsetx || 0,        // X轴微调（±10以内）
        (r.offsety || 0) - 10  // Y轴微调，默认向下偏移10px避免遮挡
      ]
    },
    lineStyle: {
      color: '#999',
      type: 'dashed',
      width: 1
    },
    symbol: 'none'
  }));

  const series = selected.map((name, idx) => {
    const data = seriesMap.get(name).sort((a, b) => a[0] - b[0]);
    const color = colors[idx % colors.length];
    const markPointData = [];

    if (showKeyPoints && data.length > 0) {
      const values = data.map(d => d[1]);
      const minVal = Math.min(...values);
      const maxVal = Math.max(...values);
      const lastPoint = data[data.length - 1];

      data.forEach(p => {
        const [time, val, rawVal] = p;
        const isLast = (time === lastPoint[0]);

        if (val === minVal || val === maxVal) {
          markPointData.push({
            coord: [time, val],
            label: {
              show: true,
              formatter: rawVal,
              color: '#000',
              fontSize: 12,
              offset: [0, -10],
              fontWeight: 'bold'
            },
            itemStyle: { color: color },
            symbolSize: 5,
            tooltip: { show: true }
          });
        }

        if (isLast) {
          markPointData.push({
            coord: [time, val],
            label: {
              show: true,
              formatter: `${name}\n${rawVal}`,
              color: '#000',
              fontSize: 12,
              fontWeight: 'bold',
              backgroundColor: 'rgba(255,255,255,0.8)',
              borderColor: '#ccc',
              borderRadius: 4,
              offset: [0, -20],
              padding: [4, 6]
            },
            itemStyle: { color: color },
            symbolSize: 5,
            tooltip: { show: true }
          });
        }
      });
    }

    if (showChangeRate && data.length >= 2) {
      for (let i = 1; i < data.length; i++) {
        const prev = data[i - 1];
        const curr = data[i];
        const diff = curr[1] - prev[1];
        const absDiff = Math.abs(diff);
        const percent = prev[1] !== 0 ? (diff / prev[1]) * 100 : 0;

        if (absDiff >= changeThreshold && Math.abs(percent) >= percentThreshold) {
          const sign = diff > 0 ? '+' : '-';
          const fmtDiff = diff.toFixed(1);
          const fmtPercent = Math.abs(percent).toFixed(1);
          const label = `${sign}${fmtDiff} (${sign}${fmtPercent}%)`;
          markPointData.push({
            coord: [curr[0], curr[1]],
            label: {
              show: true,
              formatter: `{a|${label}}`,
              offset: diff > 0 ? [0, -20] : [0, 20],
              rich: { a: { fontSize: 12, color: diff > 0 ? '#FF6B6B' : '#4ECDC4', fontWeight: 'bold' } }
            },
            itemStyle: { color: color },
            symbolSize: 4,
            tooltip: { show: true }
          });
        }
      }
    }

    const drawData = data.map(item => [item[0], item[1]]);

    // 核心修复：将 markLine 挂载到 Series 上（完全对齐Python代码逻辑）
    return {
      name,
      type: 'line',
      data: drawData,
      smooth: false,
      symbolSize: 5,
      lineStyle: { width: 2 },
      itemStyle: { color: color },
      markPoint: {
        data: markPointData
      },
      markLine: { // 仅修改这一处：添加markLine配置
        data: markLineData
      }
    };
  });

  // ========== 优化：图表标题显示年份范围 ==========
  chart.setOption({
    title: {
      text: `指标趋势图 (${startYear}-${endYear})`,
      left: 'center',
      textStyle: { fontSize: 16 }
    },
    tooltip: {
      trigger: 'axis',
      formatter: function(params) {
        const time = new Date(params[0].axisValue);
        const timeStr = time.toISOString().split('T')[0];
        const timeStamp = time.getTime();
        const medInfo = getMedicationsAtTime(timeStamp);
        let tooltipHtml = `<div style="font-size:12px;"><strong>时间：</strong>${timeStr}</div>`;
        params.forEach(param => {
          if (param.value !== null && param.value !== undefined) {
            let rawVal = param.value.toString();
            const seriesData = seriesMap.get(param.seriesName) || [];
            const findItem = seriesData.find(item => item[0] === param.axisValue);
            if (findItem) rawVal = findItem[2];
            tooltipHtml += `<div style="font-size:12px;"><strong>${param.seriesName}：</strong>${rawVal}</div>`;
          }
        });
        tooltipHtml += '<div style="font-size:12px;margin-top:4px;"><strong>用药：</strong></div>';
        medInfo.forEach(med => {
          tooltipHtml += `<div style="font-size:11px; padding-left:8px;">• ${med}</div>`;
        });
        return tooltipHtml;
      },
      backgroundColor: 'rgba(255,255,255,0.95)',
      borderColor: '#ddd',
      borderWidth: 1,
      padding: 10,
      textStyle: { fontSize: 12 }
    },
    legend: { data: selected, top: 28, itemHeight: 10, itemWidth: 10 },
    xAxis: {
      type: 'time',
      min: globalMin,
      max: globalMax
      // 移除了原有的xAxis.markLine配置
    },
    yAxis: { type: 'value' },
    series,
    grid: { top: 60, bottom: 50, left: 60, right: 40 },
    dataZoom: [
      { type: 'slider', xAxisIndex: 0, height: 20, bottom: 20, fillerColor: 'rgba(60, 180, 255, 0.15)' },
      { type: 'inside', xAxisIndex: 0, zoomOnMouseWheel: true, moveOnMouseMove: true }
    ]
  }, true);

  // ========== 调整：时间轴也应用年份筛选 ==========
  renderTimeline(timeline, medications.filter(m => {
    const medStart = m.startTimeStamp;
    const medEnd = m.endTimeStamp;
    return !(medEnd < startYearTime || medStart > endYearTime);
  }), indicatorData, globalMin, globalMax);
}

function renderTimeline(timeline, meds, indicators, globalMin, globalMax) {
  timeline.clear();

  const baseOption = {
    title: {
      text: meds.length ? '用药时间轴' : '无用药数据',
      left: 'center',
      textStyle: { fontSize: 14 }
    },
    xAxis: {
      type: 'time',
      min: globalMin,
      max: globalMax,
      axisLabel: { formatter: '{yyyy}-{MM}' }
    },
    yAxis: { type: 'value', show: false, min: 0, max: 1 },
    grid: { top: 5, bottom: 20, left: 10, right: 10 },
    tooltip: {
      show: true,
      trigger: 'item',
      formatter: (params) => {
        if (params.data && params.data._med) {
          const med = params.data._med;
          return `<strong>${med.regimen}</strong><br/>${med.startTime} 至 ${med.endTime}`;
        }
        return '';
      }
    }
  };

  if (meds.length === 0) {
    timeline.setOption(baseOption);
    document.getElementById('legendContainer').innerHTML = '<p style="font-size:0.875rem;color:#6b7280;">暂无用药记录</p>';
    return;
  }

  const regimens = [...new Set(meds.map(m => m.regimen))];
  const colors = ['#FF6B6B', '#FFD93D', '#4ECDC4', '#45B7D1', '#96CEB4', '#DDA0DD', '#FFB347', '#8BC34A'];
  const colorMap = {};
  regimens.forEach((r, i) => colorMap[r] = colors[i % colors.length]);

  const series = regimens.map(regimen => {
    const items = meds.filter(m => m.regimen === regimen);
    const data = [];
    const markPoints = [];

    items.forEach(m => {
      const start = new Date(m.startTime).getTime();
      const end = new Date(m.endTime).getTime();
      data.push([start, 0.5], [end, 0.5], [end, null]);

        // 计算持续时间文本
        const startDate = new Date(m.startTime);
        const endDate = new Date(m.endTime);
        let diffTime = endDate - startDate;
        let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        let durationText;

        if (diffDays >= 30) {
          const diffMonths = Math.floor(diffDays / 30);
          const remainingDays = diffDays - diffMonths * 30;
          durationText = remainingDays > 0
            ? `${diffMonths}个月${remainingDays}天`
            : `${diffMonths}个月`;
        } else {
          durationText = `${diffDays}天`;
        }

      const tagOrRegimen = m.tag || m.regimen || '未知';

      let fullText = `${tagOrRegimen}\n\n(${durationText})`;

      fullText = `${fullText}\n${m.startTime.slice(2)} 到 ${m.endTime.slice(2)}`;

      const midTime = (start + end) / 2;
      markPoints.push({
        name: regimen,
        coord: [midTime, 0.5],
        value: fullText,
        _med: m,
        label: {
          show: true,
          position: 'middle',
          align: 'center',
          formatter: '{c}',
          fontSize: 12,
          padding: [12, 6],
          fontWeight: 'bold',
          color: '#FFFFFF',
          width: 'auto',
          overflow: 'none'
        },
        symbol: 'circle',
        symbolSize: 1,
        itemStyle: {
          color: 'transparent'
        },
        z: 999
      });
    });

    return {
      name: regimen,
      type: 'line',
      symbol: 'none',
      lineStyle: { width: 0 },
      areaStyle: {
        color: colorMap[regimen],
        opacity: 0.7
      },
      data: data,
      markPoint: {
        data: markPoints,
        tooltip: { show: true }
      }
    };
  });

  timeline.setOption({
    ...baseOption,
    series: series
  });

  const legend = document.getElementById('legendContainer');
  legend.innerHTML = '';
  regimens.forEach(r => {
    const div = document.createElement('div');
    div.className = 'legend-item';
    div.innerHTML = `<div class="legend-color" style="background:${colorMap[r]}"></div> ${r}`;
    legend.appendChild(div);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  const showChangeRate = document.getElementById('showChangeRate');
  const changeThresholdContainer = document.getElementById('changeThresholdContainer');
  const percentThresholdContainer = document.getElementById('percentThresholdContainer');

  showChangeRate.addEventListener('change', function () {
    if (this.checked) {
      changeThresholdContainer.style.display = 'block';
      percentThresholdContainer.style.display = 'block';
    } else {
      changeThresholdContainer.style.display = 'none';
      percentThresholdContainer.style.display = 'none';
    }
  });

  // 新增：年份输入框变化时刷新图表
  document.getElementById('startYear').addEventListener('change', () => renderCharts());
  document.getElementById('endYear').addEventListener('change', () => renderCharts());

  document.getElementById('showKeyPoints').addEventListener('change', () => renderCharts());
  showChangeRate.addEventListener('change', () => renderCharts());
  document.getElementById('changeThreshold').addEventListener('input', () => renderCharts());
  document.getElementById('percentThreshold').addEventListener('input', () => renderCharts());

  changeThresholdContainer.style.display = 'none';
  percentThresholdContainer.style.display = 'none';
});
</script>
<script>
function filterIndicators() {
  const searchKeyword = document.getElementById('indicatorSearchInput').value.trim().toLowerCase();
  const allIndicatorItems = document.querySelectorAll('#checkboxContainer .checkbox-item');

  allIndicatorItems.forEach(item => {
    const indicatorName = item.getAttribute('data-indicator-name').toLowerCase();
    if (searchKeyword === '' || indicatorName.includes(searchKeyword)) {
      item.style.display = '';
    } else {
      item.style.display = 'none';
    }
  });
}

function clearAllCheckboxes() {
    const allIndicatorItems = document.querySelectorAll('#checkboxContainer .checkbox-item');
    allIndicatorItems.forEach(item => {
      // 找到当前项内的复选框（精准定位，避免选到其他复选框）
      const checkbox = item.querySelector('input[type="checkbox"]');
      if (checkbox) {
        checkbox.checked = false; // 仅取消勾选，无其他操作
      }
    });
}
</script>
